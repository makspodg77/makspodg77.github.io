<form method="POST">
    <div>
        <label>Name</label>
        <input type="text" name="name" value="{{ locality.name if locality else '' }}">
    </div>
    <div>
        <label>Municipality</label>
        <input type="text" name="municipality" value="{{ locality.municipality if locality else '' }}">
    </div>
    <div>
        <label>County</label>
        <input type="text" name="county" value="{{ locality.county if locality else '' }}">
    </div>
    <button type="submit">{{ button_label | default('Save') }}</button>
</form>
